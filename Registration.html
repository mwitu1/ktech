<!DOCTYPE html>
<html>
<head>
    <title>Website</title>
    <link rel="icon" type="image/x-icon" href="images/ktech.ico">
    <link rel="stylesheet" href="cbe.css">
</head>
<body>
    <table class="cbe" width="100%">
        <tr>
            <td colspan="6"><img src="header.jpg" alt="K-techtz" width="100%"></td>
        </tr>
       <tr align=center id="heading">
<td width=16.6% ><a href="index.html" id="under" id="under:hover">Home</a></td>
<td width=16.6%><a href="Services.html" id="under" id="under:hover">Services</a></td>
<td width=16.6%><a href="Solutions.html" id="under" id="under:hover">Solutions</a></td>
<td width=16.6%><a href="Aboutus.html" id="under" id="under:hover">About Us</a></td>
<td width=16.6%><a href="Contact.html" id="under" id="under:hover">Contact</a></td>
<td width=16.6%><a href="Registration.html" id="under" id="under:hover">Registration</a></td>
</tr>
        <tr>
            <td colspan="6" id="container">
                <p id="h">K-techtz Registration & Login</p>

                <div>
                    <button onclick="showForm('login')">Login</button>
                    <button onclick="showForm('register')">Register</button>
                </div>

                <!-- Login Form -->
                <form id="login-form" style="display:none;" method="POST" action="auth.php">
                    <h3>Login</h3>
                    <input type="hidden" name="action" value="login">

                    <label>Username:</label>
                    <input type="text" name="log-username" required>

                    <label>Password:</label>
                    <input type="password" name="log-password" required>

                    <button type="submit">Login</button>
                </form>

                <!-- Registration Form -->
                <form id="register-form" style="display:none;" method="POST" action="auth.php">
                    <h3>Register</h3>
                    <input type="hidden" name="action" value="register">

                    <label>Full Name:</label>
                    <input type="text" name="fullname" required>

                    <label>Email:</label>
                    <input type="email" name="email" required>

                    <label>Phone Number:</label>
                    <input type="text" name="country_code" placeholder="Country Code (e.g. +255)" required>
                    <input type="tel" name="phone" placeholder="Phone number" required>

                    <label>Date of Birth:</label>
                    <input type="date" name="dob" required>

                    <label>Gender:</label>
                    <select name="gender" required>
                        <option value="">-- Select Gender --</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>

                    <label>City:</label>
                    <input type="text" name="city" required>

                    <label>Select Service:</label>
                    <select name="service" required>
                        <option value="">-- Select Service --</option>
                        <option value="Web Development">Web Development</option>
                        <option value="Mobile App Development">Mobile App Development</option>
                        <option value="IT Support">IT Support</option>
                        <option value="Cybersecurity">Cybersecurity</option>
                    </select>

                    <label>Service Details:</label>
                    <textarea name="details" rows="4" placeholder="Please describe in detail the services you need." required></textarea>

                    <label>Username:</label>
                    <input type="text" name="username" required>

                    <label>Password:</label>
                    <input type="password" name="password" required>

                    <label>Confirm Password:</label>
                    <input type="password" name="confirm_password" required>

                    <div class="error" id="error-msg"></div>

                    <button type="submit">Register</button>
                </form>
            </td>
        </tr>
    </table>

    <script>
        function showForm(type) {
            document.getElementById("login-form").style.display = type === "login" ? "block" : "none";
            document.getElementById("register-form").style.display = type === "register" ? "block" : "none";
        }
    </script>
</body>
</html>
